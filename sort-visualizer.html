<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SORT_VIZ // CLI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="titlebar">
  <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
  <span class="sep">│</span>
  <span class="brand">SORT_VIZ</span>
  <span class="cursor">█</span>
  <span class="spacer"></span>
  <span class="badge" id="statusBadge">READY</span>
</div>

<div class="main">
  <div class="col-left">
    <div class="phead"><span>ALGORITHMS</span></div>
    <div class="algo-list" id="algoList"></div>
  </div>

  <div class="col-mid">
    <div class="viz"><div class="bars" id="bars"></div></div>
    <div class="legend" id="legend">
      <div class="item"><span class="sw" style="background:var(--c-idle)"></span>IDLE</div>
      <div class="item"><span class="sw" style="background:var(--c-cmp)"></span>CMP</div>
      <div class="item"><span class="sw" style="background:var(--c-swap)"></span>SWAP/SET</div>
      <div class="item" id="lgPivot"><span class="sw" style="background:var(--c-pivot)"></span>PIVOT</div>
      <div class="item"><span class="sw" style="background:var(--c-sorted)"></span>SORTED</div>
    </div>
  </div>

  <div class="col-right">
    <div class="phead"><span>SETTINGS</span></div>
    <div class="srow">
      <label>Count</label>
      <input type="range" id="countRange" min="5" max="100" value="20">
      <span class="sval" id="countVal">20</span>
    </div>
    <div class="srow">
      <label>Speed</label>
      <input type="range" id="speedRange" min="1" max="100" value="90">
      <span class="sval" id="speedVal">90</span>
    </div>
    <div class="theme-btns">
      <button class="tbtn on" data-theme-btn="terminal" data-tip="TERMINAL 主题：纯黑底 + 荧光绿，经典 CRT 终端观感">TERMINAL</button>
      <button class="tbtn" data-theme-btn="gray" data-tip="GRAY 主题：黑灰降彩，仅用灰阶区分状态，适合投屏与录屏">GRAY</button>
    </div>

    <div class="phead"><span>CONTROLS</span></div>
    <div class="controls">
      <button class="btn" id="btnPlay" data-tip="播放排序动画（快捷键：空格）">PLAY</button>
      <button class="btn" id="btnPause" data-tip="暂停动画，当前进度会保留（快捷键：空格）">PAUSE</button>
      <button class="btn" id="btnPrev" data-tip="回退一步，使用重放方式重建状态（快捷键：← 或 B）">PREV</button>
      <button class="btn" id="btnNext" data-tip="前进一步（快捷键：→ 或 N）">NEXT</button>
      <button class="btn" id="btnReset" data-tip="恢复初始数组并清空所有进度，数据本身不变（快捷键：R）">RESET</button>
      <button class="btn" id="btnRandom" data-tip="重新生成一组随机数据并清空进度">RANDOM</button>
      <button class="btn wide" id="btnGif" data-tip="把展示区动画导出为 GIF。离屏渲染，不影响页面当前状态">EXPORT GIF</button>
    </div>

    <div class="phead"><span>STATS</span></div>
    <div class="stat"><span class="k">compares</span><span class="v" id="stCompare">0</span></div>
    <div class="stat"><span class="k">swaps</span><span class="v" id="stSwap">0</span></div>
    <div class="stat"><span class="k">step</span><span class="v" id="stStep">0</span></div>
    <div class="stat"><span class="k">total</span><span class="v" id="stTotal">0</span></div>
    <div class="stat"><span class="k">time(s)</span><span class="v" id="stTime">0.000</span></div>
  </div>
</div>

<div class="logpanel">
  <div class="phead">
    <span>EXECUTION LOG</span>
    <span class="logtools">
      <button class="pbtn" id="btnCopy" data-tip="复制全部日志到剪贴板">COPY</button>
      <button class="pbtn" id="btnClear" data-tip="清空日志区">CLEAR</button>
    </span>
  </div>
  <div class="logbody" id="logBody"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<div class="celebrate" id="celebrate">
  <canvas id="fwCanvas"></canvas>
  <div class="inner">
    <div class="cel-title" id="celTitle"></div>
    <div id="celStats"></div>
    <div class="cel-time" id="celTime"></div>
    <div class="cel-hint" id="celHint">点击任意位置关闭</div>
  </div>
</div>

<!--
  脚本加载顺序即为依赖顺序，不要随意调整：
    config → step-engine → algorithms → utils → fireworks
      = 纯逻辑层（不依赖 DOM，test/verify-algorithms.js 直接抽取这一层跑单测）
    再往上依次是视图模块，最后 visualizer（编排）与 boot（启动）。

  这里刻意使用经典 <script src> 而不是 ES Module：经典脚本在 file:// 下
  可以直接双击打开，而 type="module" 会被 CORS 拦截，必须起本地服务器。
-->
<script src="js/config.js"></script>
<script src="js/step-engine.js"></script>
<script src="js/algorithms.js"></script>
<script src="js/utils.js"></script>
<script src="js/fireworks.js"></script>
<script src="js/bars-view.js"></script>
<script src="js/log-panel.js"></script>
<script src="js/stats-panel.js"></script>
<script src="js/celebration.js"></script>
<script src="js/gif-exporter.js"></script>
<script src="js/visualizer.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
