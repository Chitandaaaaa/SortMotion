<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SORT_VIZ // CLI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0a0a0a;
  --panel:#0f0f0f;
  --panel2:#151515;
  --border:#1f1f1f;
  --border2:#2b2b2b;
  --text:#00ff41;
  --dim:#5c6b5c;
  --green:#00ff41;
  --amber:#ffcc00;
  --red:#ff4444;
  --cyan:#00ccff;
  --c-idle:#3a3a3a;
  --c-cmp:#ffcc00;
  --c-swap:#ff4444;
  --c-pivot:#00ccff;
  --c-sorted:#00ff41;
  --glow-r:8px;
  --glow-soft:rgba(0,255,65,.30);
}

[data-theme="gray"]{
  --bg:#121212;
  --panel:#181818;
  --panel2:#1e1e1e;
  --border:#2a2a2a;
  --border2:#383838;
  --text:#c8c8c8;
  --dim:#6a6a6a;
  --green:#c8c8c8;
  --amber:#9a9a9a;
  --red:#7a7a7a;
  --cyan:#b0b0b0;
  --c-idle:#333333;
  --c-cmp:#8f8f8f;
  --c-swap:#5f5f5f;
  --c-pivot:#b8b8b8;
  --c-sorted:#c8c8c8;
  --glow-r:3px;
  --glow-soft:rgba(200,200,200,.12);
}

html,body{height:100%}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Consolas,Courier New,monospace;
  font-size:13px;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ===== CRT 扫描线 ===== */
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,.16) 0px,
    rgba(0,0,0,.16) 1px,
    transparent 1px,
    transparent 3px
  );
}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:0}
::-webkit-scrollbar-thumb:hover{background:var(--green)}

/* ===== 标题栏 ===== */
.titlebar{
  flex-shrink:0;
  height:30px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;display:block}
.dot.r{background:#ff5f56}
.dot.y{background:#ffbd2e}
.dot.g{background:#27c93f}
.sep{color:var(--border2);user-select:none}
.brand{
  color:var(--green);
  font-weight:bold;
  letter-spacing:1.5px;
  text-shadow:0 0 var(--glow-r) var(--green);
}
.cursor{color:var(--green);animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.spacer{flex:1}
.badge{
  font-size:11px;
  letter-spacing:1.5px;
  padding:1px 8px;
  border:1px solid var(--border2);
  color:var(--dim);
  transition:all .15s;
}
.badge.running{color:var(--amber);border-color:var(--amber);text-shadow:0 0 6px var(--amber)}
.badge.paused{color:var(--cyan);border-color:var(--cyan);text-shadow:0 0 6px var(--cyan)}
.badge.done{color:var(--green);border-color:var(--green);text-shadow:0 0 6px var(--green)}

/* ===== 主区域 ===== */
.main{flex:1;display:flex;min-height:0;min-width:0;overflow-x:auto;overflow-y:hidden}

/* 左栏 */
.col-left{
  width:170px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border-right:1px solid var(--border);
}
.phead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 10px;
  font-size:11px;
  letter-spacing:1.5px;
  color:var(--dim);
  background:var(--panel2);
  border-bottom:1px solid var(--border);
  border-top:1px solid var(--border);
  text-transform:uppercase;
  flex-shrink:0;
}
.col-left .phead:first-child,.col-right .phead:first-child{border-top:none}
.algo-list{flex:1;overflow-y:auto;padding:4px 0}
.algo-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  color:var(--dim);
  cursor:pointer;
  white-space:nowrap;
  transition:color .12s,text-shadow .12s;
}
.algo-item .mark{opacity:0;color:var(--green);flex-shrink:0}
.algo-item:hover{color:var(--text)}
.algo-item.sel{color:var(--green);text-shadow:0 0 var(--glow-r) var(--green)}
.algo-item.sel .mark{opacity:1}

/* 中栏 */
/* min-width 兜住中栏：页面放大到很窄时宁可整页横向滚动，
   也不让展示区被压成 0 宽导致柱子全挤在左边 */
.col-mid{flex:1;min-width:220px;display:flex;flex-direction:column;background:var(--bg)}
.viz{flex:1;min-height:0;display:flex;padding:14px 14px 8px 14px}
.bars{
  flex:1;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column-reverse;
  align-items:flex-start;
  /* column-reverse 下 flex-start 对应「底边」，会贴着底。居中让整组柱子上下对称留白 */
  justify-content:center;
  /* --bar-gap 由数据量 n 决定（initBars 里设置，不读容器尺寸），再叠加视口高度收敛 */
  gap:min(var(--bar-gap, 3px), 0.55vh);
  overflow:hidden;
}
.vbar{
  /* 高度由 flex 均分撑满（上限 24px），宽度由 JS 写成百分比。
     两轴都不存 px 绝对值，所以缩放/改窗口后不需要任何重算。 */
  flex:1 1 0;
  min-width:2px;
  min-height:2px;
  max-height:24px;
  width:0;
  border-radius:1px;
  background:var(--c-idle);
  transition:width .1s linear,background-color .08s linear,box-shadow .08s linear;
}
.vbar.compare{background:var(--c-cmp);box-shadow:0 0 var(--glow-r) var(--c-cmp)}
.vbar.swap{background:var(--c-swap);box-shadow:0 0 var(--glow-r) var(--c-swap)}
.vbar.pivot{background:var(--c-pivot);box-shadow:0 0 var(--glow-r) var(--c-pivot)}
.vbar.sorted{background:var(--c-sorted);box-shadow:0 0 calc(var(--glow-r) * .7) var(--c-sorted)}

.legend{
  flex-shrink:0;
  height:30px;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 14px;
  font-size:11px;
  color:var(--dim);
  letter-spacing:1px;
  background:var(--panel);
  border-top:1px solid var(--border);
}
.legend .item{display:flex;align-items:center;gap:5px}
.legend .sw{width:14px;height:8px;border-radius:1px;display:block}
.legend .item.hide{display:none}

/* 右栏 */
.col-right{
  width:250px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border-left:1px solid var(--border);
  overflow-y:auto;
}
.srow{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
}
.srow label{color:var(--dim);font-size:11px;width:44px;flex-shrink:0;letter-spacing:.5px}
.srow input[type=range]{
  flex:1;
  -webkit-appearance:none;
  appearance:none;
  height:3px;
  background:var(--border2);
  outline:none;
  cursor:pointer;
}
.srow input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:10px;
  height:14px;
  background:var(--green);
  border:none;
  border-radius:1px;
  cursor:pointer;
  box-shadow:0 0 6px var(--green);
}
.srow input[type=range]::-moz-range-thumb{
  width:10px;
  height:14px;
  background:var(--green);
  border:none;
  border-radius:1px;
  cursor:pointer;
}
.sval{color:var(--green);font-size:11px;width:26px;text-align:right;flex-shrink:0}

.theme-btns{display:flex;gap:6px;padding:2px 10px 10px}
.tbtn{
  flex:1;
  padding:5px 2px;
  background:transparent;
  border:1px solid var(--border2);
  color:var(--dim);
  font-family:inherit;
  font-size:11px;
  letter-spacing:1px;
  cursor:pointer;
  transition:all .12s;
}
.tbtn:hover{color:var(--text);border-color:var(--border2)}
.tbtn.on{
  color:var(--green);
  border-color:var(--green);
  text-shadow:0 0 6px var(--green);
  box-shadow:0 0 6px var(--glow-soft);
}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px}
.btn{
  padding:6px 4px;
  background:transparent;
  border:1px solid var(--border2);
  color:var(--text);
  font-family:inherit;
  font-size:11px;
  letter-spacing:1px;
  cursor:pointer;
  transition:all .12s;
  white-space:nowrap;
}
.btn:hover:not(:disabled){
  border-color:var(--green);
  color:var(--green);
  box-shadow:0 0 8px var(--glow-soft);
}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.wide{grid-column:1 / -1}

.stat{
  display:flex;
  justify-content:space-between;
  padding:4px 10px;
  font-size:12px;
}
.stat .k{color:var(--dim)}
.stat .v{color:var(--green)}

/* 日志 */
.logpanel{
  flex-shrink:0;
  /* 常规屏幕下就是规格要求的 150px；视口变矮（例如页面放大）时自动收缩，
     把高度让给展示区，避免柱子被压没 */
  height:clamp(72px, 18vh, 150px);
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border-top:1px solid var(--border);
}
.logpanel .phead{border-top:none}
.logtools{display:flex;gap:6px}
.pbtn{
  background:transparent;
  border:1px solid var(--border2);
  color:var(--dim);
  font-family:inherit;
  font-size:10px;
  letter-spacing:1px;
  padding:2px 8px;
  cursor:pointer;
  transition:all .12s;
}
.pbtn:hover{color:var(--green);border-color:var(--green)}
.logbody{
  flex:1;
  overflow-y:auto;
  padding:6px 10px;
  font-size:12px;
  line-height:1.55;
}
.logbody .ln{white-space:pre-wrap;word-break:break-all}
.ln.compare{color:var(--amber)}
.ln.swap{color:var(--red)}
.ln.sorted{color:var(--green)}
.ln.info{color:var(--cyan)}
.ln.pivot{color:var(--cyan)}
.ln.done{color:var(--green);font-weight:bold}

/* Tooltip */
.tooltip{
  position:fixed;
  display:none;
  z-index:10001;
  pointer-events:none;
  background:var(--panel2);
  border:1px solid var(--green);
  color:var(--green);
  padding:6px 10px;
  font-size:12px;
  line-height:1.5;
  max-width:280px;
  box-shadow:0 0 14px var(--glow-soft);
}

/* 庆祝弹窗 */
.celebrate{
  position:fixed;
  inset:0;
  z-index:10000;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.celebrate canvas{position:absolute;inset:0;width:100%;height:100%}
.celebrate .inner{position:relative;z-index:2;text-align:center;padding:0 24px}
.cel-title{
  font-size:52px;
  color:#ffd700;
  letter-spacing:6px;
  margin-bottom:28px;
  line-height:1.2;
}
.cel-title span{
  display:inline-block;
  opacity:0;
  transform:translate(-12px,8px);
  transition:opacity .45s ease,transform .45s ease;
  text-shadow:0 0 22px rgba(255,215,0,.85);
}
.cel-title span.in{opacity:1;transform:translate(0,0)}
.cel-line{font-size:18px;color:var(--green);margin:7px 0;letter-spacing:2px}
.cel-line span{
  display:inline-block;
  opacity:0;
  transform:translate(-8px,6px)  ;
  transition:opacity .3s ease,transform .3s ease;
}
.cel-line span.in{opacity:1;transform:translate(0,0)}
.cel-time{font-size:22px;color:var(--green);margin-top:18px;letter-spacing:2px}
.cel-time span{
  display:inline-block;
  opacity:0;
  transform:translate(-8px,6px);
  transition:opacity .3s ease,transform .3s ease;
  text-shadow:0 0 12px var(--green);
}
.cel-time span.in{opacity:1;transform:translate(0,0)}
.cel-hint{
  margin-top:28px;
  font-size:12px;
  color:var(--dim);
  letter-spacing:3px;
  opacity:0;
  transition:opacity .7s ease;
}
.cel-hint.in{opacity:1}
</style>
</head>
<body>

<div class="titlebar">
  <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
  <span class="sep">│</span>
  <span class="brand">SORT_VIZ</span>
  <span class="cursor">█</span>
  <span class="spacer"></span>
  <span class="badge" id="statusBadge">READY</span>
</div>

<div class="main">
  <div class="col-left">
    <div class="phead"><span>ALGORITHMS</span></div>
    <div class="algo-list" id="algoList"></div>
  </div>

  <div class="col-mid">
    <div class="viz"><div class="bars" id="bars"></div></div>
    <div class="legend" id="legend">
      <div class="item"><span class="sw" style="background:var(--c-idle)"></span>IDLE</div>
      <div class="item"><span class="sw" style="background:var(--c-cmp)"></span>CMP</div>
      <div class="item"><span class="sw" style="background:var(--c-swap)"></span>SWAP</div>
      <div class="item" id="lgPivot"><span class="sw" style="background:var(--c-pivot)"></span>PIVOT</div>
      <div class="item"><span class="sw" style="background:var(--c-sorted)"></span>SORTED</div>
    </div>
  </div>

  <div class="col-right">
    <div class="phead"><span>SETTINGS</span></div>
    <div class="srow">
      <label>Count</label>
      <input type="range" id="countRange" min="5" max="100" value="20">
      <span class="sval" id="countVal">20</span>
    </div>
    <div class="srow">
      <label>Speed</label>
      <input type="range" id="speedRange" min="1" max="100" value="90">
      <span class="sval" id="speedVal">90</span>
    </div>
    <div class="theme-btns">
      <button class="tbtn on" data-theme-btn="terminal" data-tip="TERMINAL 主题：纯黑底 + 荧光绿，经典 CRT 终端观感">TERMINAL</button>
      <button class="tbtn" data-theme-btn="gray" data-tip="GRAY 主题：黑灰降彩，仅用灰阶区分状态，适合投屏与录屏">GRAY</button>
    </div>

    <div class="phead"><span>CONTROLS</span></div>
    <div class="controls">
      <button class="btn" id="btnPlay" data-tip="播放排序动画（快捷键：空格）">PLAY</button>
      <button class="btn" id="btnPause" data-tip="暂停动画，当前进度会保留（快捷键：空格）">PAUSE</button>
      <button class="btn" id="btnPrev" data-tip="回退一步，使用重放方式重建状态（快捷键：← 或 B）">PREV</button>
      <button class="btn" id="btnNext" data-tip="前进一步（快捷键：→ 或 N）">NEXT</button>
      <button class="btn" id="btnReset" data-tip="恢复初始数组并清空所有进度，数据本身不变（快捷键：R）">RESET</button>
      <button class="btn" id="btnRandom" data-tip="重新生成一组随机数据并清空进度">RANDOM</button>
      <button class="btn wide" id="btnGif" data-tip="把展示区动画导出为 GIF。离屏渲染，不影响页面当前状态">EXPORT GIF</button>
    </div>

    <div class="phead"><span>STATS</span></div>
    <div class="stat"><span class="k">compares</span><span class="v" id="stCompare">0</span></div>
    <div class="stat"><span class="k">swaps</span><span class="v" id="stSwap">0</span></div>
    <div class="stat"><span class="k">step</span><span class="v" id="stStep">0</span></div>
    <div class="stat"><span class="k">total</span><span class="v" id="stTotal">0</span></div>
    <div class="stat"><span class="k">time(s)</span><span class="v" id="stTime">0.000</span></div>
  </div>
</div>

<div class="logpanel">
  <div class="phead">
    <span>EXECUTION LOG</span>
    <span class="logtools">
      <button class="pbtn" id="btnCopy" data-tip="复制全部日志到剪贴板">COPY</button>
      <button class="pbtn" id="btnClear" data-tip="清空日志区">CLEAR</button>
    </span>
  </div>
  <div class="logbody" id="logBody"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<div class="celebrate" id="celebrate">
  <canvas id="fwCanvas"></canvas>
  <div class="inner">
    <div class="cel-title" id="celTitle"></div>
    <div id="celStats"></div>
    <div class="cel-time" id="celTime"></div>
    <div class="cel-hint" id="celHint">点击任意位置关闭</div>
  </div>
</div>

<script>
"use strict";

/* =======================================================================
   1. 步骤类型 & 算法基类
   ======================================================================= */
var StepType = {
  COMPARE: "COMPARE",
  SWAP: "SWAP",
  SET: "SET",
  MARK_SORTED: "MARK_SORTED",
  PIVOT: "PIVOT",
  INFO: "INFO",
  DONE: "DONE"
};

function AlgorithmBase(name, label, cnLabel) {
  this.name = name;
  this.label = label;
  this.cnLabel = cnLabel;
  this.steps = [];
  this.compareCount = 0;
  this.swapCount = 0;
  this.arr = null;
}

AlgorithmBase.prototype.record = function (type, data, message, indices) {
  this.steps.push({
    type: type,
    data: data ? data.slice() : null,
    message: message,
    indices: indices || [],
    compareCount: this.compareCount,
    swapCount: this.swapCount
  });
};

AlgorithmBase.prototype.compare = function (arr, i, j) {
  this.compareCount++;
  this.record(StepType.COMPARE, null, "比较 arr[" + i + "]=" + arr[i] + " 与 arr[" + j + "]=" + arr[j], [i, j]);
  return arr[i] - arr[j];
};

AlgorithmBase.prototype.swap = function (arr, i, j) {
  var vi = arr[i], vj = arr[j];
  // 先执行真实交换，再记录快照 —— 保证高亮时柱子宽度已经是交换后的值
  arr[i] = vj;
  arr[j] = vi;
  this.swapCount++;
  this.record(StepType.SWAP, arr, "交换 arr[" + i + "]=" + vi + " ↔ arr[" + j + "]=" + vj, [i, j]);
};

AlgorithmBase.prototype.markSorted = function (i) {
  var v = this.arr ? this.arr[i] : "";
  this.record(StepType.MARK_SORTED, null, "arr[" + i + "]=" + v + " 已就位", [i]);
};

AlgorithmBase.prototype.markPivot = function (i) {
  var v = this.arr ? this.arr[i] : "";
  this.record(StepType.PIVOT, null, "标记枢轴 arr[" + i + "]=" + v, [i]);
};

AlgorithmBase.prototype.info = function (msg) {
  this.record(StepType.INFO, null, msg, []);
};

AlgorithmBase.prototype.done = function (arr) {
  this.record(StepType.DONE, arr,
    "排序完成：共 " + this.compareCount + " 次比较、" + this.swapCount + " 次交换",
    []);
};

AlgorithmBase.prototype.sort = function (arr) { /* 子类实现 */ };

AlgorithmBase.prototype.run = function (input) {
  this.steps = [];
  this.compareCount = 0;
  this.swapCount = 0;
  var work = input.slice();
  this.arr = work;
  this.sort(work);
  this.done(work);
  return this.steps;
};

/* =======================================================================
   2. 五种内置算法
   ======================================================================= */

/* --- 冒泡排序（含 early exit 优化） --- */
function BubbleSort() {
  AlgorithmBase.call(this, "bubble", "BubbleSort", "冒泡排序");
}
BubbleSort.prototype = Object.create(AlgorithmBase.prototype);
BubbleSort.prototype.constructor = BubbleSort;
BubbleSort.prototype.sort = function (arr) {
  var n = arr.length, i, j, k, swapped;
  for (i = 0; i < n - 1; i++) {
    swapped = false;
    for (j = 0; j < n - 1 - i; j++) {
      if (this.compare(arr, j, j + 1) > 0) {
        this.swap(arr, j, j + 1);
        swapped = true;
      }
    }
    this.markSorted(n - 1 - i);
    if (!swapped) {
      this.info("本轮无交换，序列已有序，提前结束");
      for (k = 0; k <= n - 2 - i; k++) this.markSorted(k);
      return;
    }
  }
  this.markSorted(0);
};

/* --- 选择排序 --- */
function SelectionSort() {
  AlgorithmBase.call(this, "selection", "SelectionSort", "选择排序");
}
SelectionSort.prototype = Object.create(AlgorithmBase.prototype);
SelectionSort.prototype.constructor = SelectionSort;
SelectionSort.prototype.sort = function (arr) {
  var n = arr.length, i, j, min;
  for (i = 0; i < n - 1; i++) {
    this.markPivot(i);
    min = i;
    for (j = i + 1; j < n; j++) {
      if (this.compare(arr, j, min) < 0) min = j;
    }
    if (min !== i) this.swap(arr, i, min);
    this.markSorted(i);
  }
  this.markSorted(n - 1);
};

/* --- 插入排序 --- */
function InsertionSort() {
  AlgorithmBase.call(this, "insertion", "InsertionSort", "插入排序");
}
InsertionSort.prototype = Object.create(AlgorithmBase.prototype);
InsertionSort.prototype.constructor = InsertionSort;
InsertionSort.prototype.sort = function (arr) {
  var n = arr.length, i, j;
  if (n > 0) this.markSorted(0);
  for (i = 1; i < n; i++) {
    this.markPivot(i);
    j = i;
    while (j > 0 && this.compare(arr, j - 1, j) > 0) {
      this.swap(arr, j - 1, j);
      j--;
    }
    this.markSorted(i);
  }
};

/* --- 快速排序（Lomuto 分区，取末元素为枢轴） --- */
function QuickSort() {
  AlgorithmBase.call(this, "quick", "QuickSort", "快速排序");
}
QuickSort.prototype = Object.create(AlgorithmBase.prototype);
QuickSort.prototype.constructor = QuickSort;
QuickSort.prototype._partition = function (arr, lo, hi) {
  var i = lo - 1, j;
  for (j = lo; j < hi; j++) {
    if (this.compare(arr, j, hi) < 0) {
      i++;
      if (i !== j) this.swap(arr, i, j);
    }
  }
  if (i + 1 !== hi) this.swap(arr, i + 1, hi);
  return i + 1;
};
QuickSort.prototype._qs = function (arr, lo, hi) {
  if (lo > hi) return;
  if (lo === hi) { this.markSorted(lo); return; }
  this.markPivot(hi);
  var p = this._partition(arr, lo, hi);
  this.markSorted(p);
  this._qs(arr, lo, p - 1);
  this._qs(arr, p + 1, hi);
};
QuickSort.prototype.sort = function (arr) {
  this._qs(arr, 0, arr.length - 1);
  for (var i = 0; i < arr.length; i++) this.markSorted(i);
};

/* --- 堆排序 --- */
function HeapSort() {
  AlgorithmBase.call(this, "heap", "HeapSort", "堆排序");
}
HeapSort.prototype = Object.create(AlgorithmBase.prototype);
HeapSort.prototype.constructor = HeapSort;
HeapSort.prototype._siftDown = function (arr, start, end) {
  var root = start, child;
  while (2 * root + 1 <= end) {
    child = 2 * root + 1;
    if (child + 1 <= end && this.compare(arr, child, child + 1) < 0) child++;
    if (this.compare(arr, root, child) < 0) {
      this.swap(arr, root, child);
      root = child;
    } else {
      break;
    }
  }
};
HeapSort.prototype.sort = function (arr) {
  var n = arr.length, i, end;
  this.info("阶段一：自底向上构建大顶堆");
  for (i = Math.floor(n / 2) - 1; i >= 0; i--) this._siftDown(arr, i, n - 1);
  this.info("阶段二：逐个把堆顶交换到末尾并重新下沉");
  for (end = n - 1; end > 0; end--) {
    this.swap(arr, 0, end);
    this.markSorted(end);
    this._siftDown(arr, 0, end - 1);
  }
  this.markSorted(0);
};

/* =======================================================================
   3. 算法注册表
   ======================================================================= */
var AlgorithmRegistry = {
  _map: {},
  _order: [],
  register: function (algo) {
    if (!this._map[algo.name]) this._order.push(algo.name);
    this._map[algo.name] = algo;
  },
  get: function (name) { return this._map[name]; },
  getAll: function () {
    var self = this;
    return this._order.map(function (n) { return self._map[n]; });
  },
  init: function () {
    this.register(new BubbleSort());
    this.register(new SelectionSort());
    this.register(new InsertionSort());
    this.register(new QuickSort());
    this.register(new HeapSort());
  }
};

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function readThemeColors() {

/* 终端角标边框（四角 L 形括号） */
function drawCornerFrame(ctx, rect, color, alpha) {
  var L = 14, lw = 1.5;
  var x = rect.x, y = rect.y, w = rect.w, h = rect.h;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.lineCap = "square";
  ctx.beginPath(); ctx.moveTo(x, y + L); ctx.lineTo(x, y); ctx.lineTo(x + L, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + w - L, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + L); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + w, y + h - L); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - L, y + h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + L, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - L); ctx.stroke();
  ctx.restore();
}

/* 绘制柱状图（Canvas 版：索引 0 在底部，与页面一致） */
function drawBarsOnCanvas(ctx, data, sortedSet, hl, area, colors, alpha) {
  var n = data.length;
  if (!n) return;
  var max = 1, i;
  for (i = 0; i < n; i++) if (data[i] > max) max = data[i];
  var gap = n > 30 ? 1 : 2;
  var bh = Math.floor((area.h - (n - 1) * gap) / n);
  if (bh < 1) { bh = 1; gap = 0; }
  ctx.save();
  ctx.globalAlpha = (alpha === undefined ? 1 : alpha);
  for (i = 0; i < n; i++) {
    var y = area.y + (n - 1 - i) * (bh + gap);
    var w = (data[i] / max) * area.w;
    if (w < 2) w = 2;
    var c = colors.idle;
    var h = hl[i];
    if (h === "compare") c = colors.cmp;
    else if (h === "swap") c = colors.swap;
    else if (h === "pivot") c = colors.pivot;
    else if (sortedSet[i]) c = colors.sorted;
    ctx.fillStyle = c;
    ctx.fillRect(area.x, y, w, bh);
  }
  ctx.restore();
}

/* 画布上的逐字动画文字 */
function drawAnimatedText(ctx, text, cx, cy, size, color, progress, glow) {
  var chars = Array.from(text);
  var n = chars.length;
  if (!n) return;
  ctx.save();
  ctx.font = "bold " + size + "px 'Microsoft YaHei',Consolas,'Courier New',monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  var widths = chars.map(function (c) { return ctx.measureText(c).width; });
  var total = widths.reduce(function (a, b) { return a + b; }, 0);
  var x = cx - total / 2;
  for (var i = 0; i < n; i++) {
    var start = i / (n * 1.5);
    var p = (progress - start) / 0.35;
    if (p > 1) p = 1;
    if (p > 0) {
      ctx.save();
      ctx.globalAlpha = p;
      if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 12; }
      ctx.fillStyle = color;
      ctx.fillText(chars[i], x + (1 - p) * -8, cy + (1 - p) * 6);
      ctx.restore();
    }
    x += widths[i];
  }
  ctx.restore();
}

/* =======================================================================
   5. 烟花粒子引擎（庆祝弹窗 / GIF 结尾共用）
   ======================================================================= */
function Fireworks(w, h) {
  this.w = w;
  this.h = h;
  this.parts = [];
  this.acc = 0;
  this.next = 0;
  this.colors = [
    "#ff4444", "#ffcc00", "#00ff41", "#00ccff",
    "#ff8c00", "#ff69b4", "#ffffff", "#b388ff", "#00ffd5"
  ];
}
Fireworks.prototype.burst = function (cx, cy) {
  var count = 32 + Math.floor(Math.random() * 16);
  var baseHue = this.colors[Math.floor(Math.random() * this.colors.length)];
  for (var i = 0; i < count; i++) {
    var ang = (Math.PI * 2 * i) / count + Math.random() * 0.16;
    var spd = 1.6 + Math.random() * 4.2;
    this.parts.push({
      x: cx,
      y: cy,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 1,
      color: Math.random() < 0.72 ? baseHue : this.colors[Math.floor(Math.random() * this.colors.length)],
      size: 1.4 + Math.random() * 1.8
    });
  }
};
Fireworks.prototype.spawn = function () {
  var cx = this.w * (0.22 + Math.random() * 0.56);
  var cy = this.h * (0.2 + Math.random() * 0.45);
  this.burst(cx, cy);
};
Fireworks.prototype.step = function (dt) {
  this.acc += dt;
  if (this.acc >= this.next) {
    this.acc = 0;
    this.next = 12 + Math.random() * 24;
    this.spawn();
  }
  var damp = Math.pow(0.985, dt);
  var i, p;
  for (i = 0; i < this.parts.length; i++) {
    p = this.parts[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 0.06 * dt;
    p.vx *= damp;
    p.vy *= damp;
    p.life -= 0.011 * dt;
  }
  var alive = [];
  for (i = 0; i < this.parts.length; i++) {
    if (this.parts[i].life > 0) alive.push(this.parts[i]);
  }
  this.parts = alive;
};
Fireworks.prototype.draw = function (ctx, withTrail) {
  if (withTrail) {
    ctx.save();
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(0, 0, this.w, this.h);
    ctx.restore();
  }
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (var i = 0; i < this.parts.length; i++) {
    var p = this.parts[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
};

/* ---------- 初始化 ---------- */
Visualizer.prototype.init = function () {
  AlgorithmRegistry.init();

  // 统计时间刷新
  var self = this;
  setInterval(function () {
    if (self.startTime && !self.finished) self.updateStats();
  }, 100);

  // 柱子几何（高度、宽度）完全由 CSS 决定（flex 撑高 + 百分比宽度），
  // 所以窗口缩放、拖拽面板、浏览器 zoom 都不需要 JS 重算，也就不会留下过期尺寸。
  // 这里的 observer 只是兜底：万一元素数量与数据长度不同步，重建一次。
  self.syncBars();

  if (window.ResizeObserver) {
    this._ro = new ResizeObserver(function () { self.syncBars(); });
    this._ro.observe(this.barsEl);
  } else {
    window.addEventListener("resize", function () { self.syncBars(); });
  }
};

/* 只在元素数量不一致时重建 DOM，尺寸交给 CSS */
Visualizer.prototype.syncBars = function () {

};

Visualizer.prototype.algoTip = function (name) {

    selection: "每轮从未排序区选出最小值，放到已排序区末尾",
    insertion: "把每个元素向前插入到已排序序列中的正确位置",

/* ---------- Tooltip ---------- */
Visualizer.prototype.bindTooltip = function () {
  var self = this;
  var tipEl = null;
  var timer = null;
  var visible = false;
  var mx = 0, my = 0;

  function place() {
    var pad = 14;
    var w = self.tooltip.offsetWidth;
    var h = self.tooltip.offsetHeight;
    var x = mx + pad;
    var y = my + pad;
    if (x + w > window.innerWidth - 6) x = mx - w - pad;
    if (y + h > window.innerHeight - 6) y = my - h - pad;
    self.tooltip.style.left = Math.max(4, x) + "px";
    self.tooltip.style.top = Math.max(4, y) + "px";
  }
  function hide() {
    if (timer) { clearTimeout(timer); timer = null; }
    visible = false;
    self.tooltip.style.display = "none";
  }

  document.addEventListener("mousemove", function (e) {
    mx = e.clientX; my = e.clientY;
    if (visible) place();
  });
  document.addEventListener("mouseover", function (e) {
    var el = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (el === tipEl) return;
    tipEl = el;
    hide();
    if (el) {
      var txt = el.getAttribute("data-tip");
      if (!txt) return;
      timer = setTimeout(function () {
        self.tooltip.textContent = txt;
        self.tooltip.style.display = "block";
        visible = true;
        place();
      }, 1000);
    }
  });
  document.addEventListener("mouseout", function (e) {
    if (!tipEl) return;
    if (e.relatedTarget && tipEl.contains(e.relatedTarget)) return;
    tipEl = null;
    hide();
  });
};

/* ---------- 主题 ---------- */
Visualizer.prototype.bindTheme = function () {
  var self = this;
  var btns = document.querySelectorAll("[data-theme-btn]");
  for (var i = 0; i < btns.length; i++) {
    (function (b) {
      b.addEventListener("click", function () {
        var t = b.getAttribute("data-theme-btn");
        if (t === "gray") document.documentElement.setAttribute("data-theme", "gray");
        else document.documentElement.removeAttribute("data-theme");
        for (var k = 0; k < btns.length; k++) {
          btns[k].classList.toggle("on", btns[k] === b);
        }
        // 主题切换后重绘柱子（颜色由 CSS 变量接管，无需额外操作）

};

Visualizer.prototype.bindKeyboard = function () {
  var self = this;
  document.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    var k = e.key;
    if (k === " " || k === "Spacebar") {
      e.preventDefault();
      if (self.isPlaying) self.pause(); else self.play();
      return;
    }
    if (k === "n" || k === "N" || k === "ArrowRight") { e.preventDefault(); self.stepForward(); return; }
    if (k === "b" || k === "B" || k === "ArrowLeft") { e.preventDefault(); self.stepBackward(); return; }
    if (k === "r" || k === "R") { e.preventDefault(); self.reset(); return; }
  });
};

/* ---------- 数据 ---------- */

  }

/* 只负责创建/销毁柱子元素；高度、宽度、间距全部由 CSS 决定 */
Visualizer.prototype.initBars = function () {
  var n = this.data.length;
  this.barsEl.innerHTML = "";
  this.bars = [];
  if (!n) return;
  // 间距只跟数据量有关：n 越大柱子越细，间距也要跟着收，否则留白比柱子还宽
  this.barsEl.style.setProperty("--bar-gap", (n > 70 ? 1 : n > 40 ? 2 : 3) + "px");
  var frag = document.createDocumentFragment();
  for (var i = 0; i < n; i++) {
    var b = document.createElement("div");
    b.className = "vbar";
    frag.appendChild(b);
    this.bars.push(b);
  }
  this.barsEl.appendChild(frag);
};

Visualizer.prototype.updateBars = function () {
  var n = this.data.length;
  if (!n) return;
  if (this.bars.length !== n) this.initBars();
  var max = 1, i;
  for (i = 0; i < n; i++) if (this.data[i] > max) max = this.data[i];
  for (i = 0; i < n; i++) {
    var b = this.bars[i];
    if (!b) continue;
    // 百分比宽度：容器宽度怎么变都自动跟随，不会残留过期的 px 尺寸
    b.style.width = ((this.data[i] / max) * 100).toFixed(3) + "%";
    var hl = this.activeHL[i];
    b.className = "vbar" + (hl ? " " + hl : (this.sortedSet[i] ? " sorted" : ""));
  }
};

  this.stepCount = 0;
  this.logBody.innerHTML = "";
  this.hideCelebration();
  this.prepareSteps();      // 算出 total，但不启动计时
  this.updateBars();
  this.updateStats();
  this.setStatus("READY");
};

Visualizer.prototype.randomize = function () {
  this.pause(true);
  this.generateData();
  this.initBars();
  this.data = this.originalData.slice();
  this.steps = [];
  this.currentStep = 0;
  this.sortedSet = {};
  this.activeHL = {};
  this.startTime = null;
  this.elapsed = 0;
  this.finished = false;
  this.compares = 0;
  this.swaps = 0;
  this.stepCount = 0;
  this.logBody.innerHTML = "";
  this.hideCelebration();
  this.prepareSteps();
  this.updateBars();
  this.updateStats();
  this.setStatus("READY");
};

Visualizer.prototype.prepareSteps = function () {
  var algo = AlgorithmRegistry.get(this.selectedAlgo);
  this.steps = algo.run(this.data.slice());
  this.currentStep = 0;
  this.sortedSet = {};
  this.activeHL = {};
  this.finished = false;
  this.total = 0;
  for (var i = 0; i < this.steps.length; i++) {
    var t = this.steps[i].type;
    if (t === StepType.COMPARE || t === StepType.SWAP) this.total++;
  }
  this.addLogRunHeader();
};

/* 日志头部（算法名 / 初始数组 / 步骤总数）。
   prepareSteps 与 replayTo 都要打，否则 PREV 回退后日志会丢掉头部只剩步骤行。 */
Visualizer.prototype.addLogRunHeader = function () {
  var algo = AlgorithmRegistry.get(this.selectedAlgo);
  this.addLog("info", "加载算法 " + algo.label + " / " + algo.cnLabel + "，n = " + this.originalData.length);
  this.addLog("info", "初始数组 [" + this.originalData.join(", ") + "]");
  this.addLog("info", "步骤序列已生成，共 " + this.steps.length + " 步（其中比较+交换 " + this.total + " 次）");
};

/* ---------- 播放控制 ---------- */
Visualizer.prototype.play = function () {
  if (this.isPlaying) return;
  if (this.steps.length === 0) this.prepareSteps();
  if (this.currentStep >= this.steps.length) {
    // 已完成 → 从头开始
    this.reset();
  }
  if (!this.startTime) this.startTime = Date.now();
  this.finished = false;
  this.isPlaying = true;
  this.setStatus("RUNNING");
  this.tick();
};

Visualizer.prototype.pause = function (silent) {
  this.isPlaying = false;
  this.clearTimer();
  if (!silent) {
    if (!this.finished && this.currentStep > 0) this.setStatus("PAUSED");
    this.updateStats();
  }
};

Visualizer.prototype.tick = function () {
  var self = this;
  if (!this.isPlaying) return;
  if (this.currentStep >= this.steps.length) { this.finish(); return; }
  this.executeStep();
  this.currentStep++;
  this.updateBars();
  this.updateStats();
  if (this.currentStep >= this.steps.length) { this.finish(); return; }
  var delay = 810 - this.speed * 8;
  if (delay < 10) delay = 10;
  this.timer = setTimeout(function () { self.tick(); }, delay);
};

Visualizer.prototype.stepForward = function () {
  if (this.isPlaying) this.pause();
  if (this.steps.length === 0) this.prepareSteps();
  if (this.currentStep >= this.steps.length) return;
  if (!this.startTime) this.startTime = Date.now();
  this.finished = false;
  this.executeStep();
  this.currentStep++;
  this.updateBars();
  this.updateStats();
  if (this.currentStep >= this.steps.length) {
    this.finish();
  } else {
    this.setStatus("PAUSED");
  }
};

Visualizer.prototype.stepBackward = function () {
  if (this.isPlaying) this.pause();
  if (this.steps.length === 0) return;
  if (this.currentStep <= 0) return;
  this.finished = false;
  this.replayTo(this.currentStep - 1);
  this.setStatus(this.currentStep === 0 ? "READY" : "PAUSED");
};

/* 从原始数据重放 0..target-1 步，重建全部状态 */
Visualizer.prototype.replayTo = function (target) {
  this.clearTimer();
  this.data = this.originalData.slice();
  this.sortedSet = {};
  this.activeHL = {};
  this.currentStep = 0;
  this.compares = 0;
  this.swaps = 0;
  this.stepCount = 0;
  this.logBody.innerHTML = "";
  this.addLogRunHeader();

  for (var i = 0; i < target; i++) {
    this.applyStep(this.steps[i]);
    this.currentStep = i + 1;
  }
  this.updateBars();
  this.updateStats();
};

Visualizer.prototype.executeStep = function () {
  if (this.currentStep >= this.steps.length) return;
  this.applyStep(this.steps[this.currentStep]);
};

Visualizer.prototype.applyStep = function (step) {
  this.activeHL = {};
  var i;
  if (step.type === StepType.COMPARE) {
    for (i = 0; i < step.indices.length; i++) this.activeHL[step.indices[i]] = "compare";
    this.addLog("compare", step.message, step);
  } else if (step.type === StepType.SWAP) {
    if (step.data) this.data = step.data.slice();
    for (i = 0; i < step.indices.length; i++) this.activeHL[step.indices[i]] = "swap";
    this.addLog("swap", step.message, step);
  } else if (step.type === StepType.SET) {
    if (step.data) this.data = step.data.slice();
    this.addLog("info", step.message, step);
  } else if (step.type === StepType.MARK_SORTED) {
    for (i = 0; i < step.indices.length; i++) this.sortedSet[step.indices[i]] = true;
    this.addLog("sorted", step.message, step);
  } else if (step.type === StepType.PIVOT) {
    for (i = 0; i < step.indices.length; i++) this.activeHL[step.indices[i]] = "pivot";
    this.addLog("pivot", step.message, step);
  } else if (step.type === StepType.INFO) {
    this.addLog("info", step.message, step);
  } else if (step.type === StepType.DONE) {
    if (step.data) this.data = step.data.slice();
    for (i = 0; i < this.data.length; i++) this.sortedSet[i] = true;
    this.activeHL = {};
    this.addLog("done", step.message, step);
  }
  this.compares = step.compareCount;
  this.swaps = step.swapCount;
  this.stepCount = step.compareCount + step.swapCount;
};

Visualizer.prototype.finish = function () {
  this.isPlaying = false;
  this.finished = true;
  this.clearTimer();
  if (this.startTime) this.elapsed = (Date.now() - this.startTime) / 1000;
  this.updateBars();
  this.updateStats();
  this.setStatus("DONE");
  this.addLog("done", "全部完成，总耗时 " + this.elapsed.toFixed(3) + " s / 比较 " +
    this.compares + " 次 / 交换 " + this.swaps + " 次");
  this.showCelebration();
};

/* ---------- 日志 ---------- */
Visualizer.prototype.addLog = function (type, msg, step) {
  var line = document.createElement("div");
  line.className = "ln " + type;
  var num = step ? (this.currentStep + 1) : 0;
  line.textContent = "[" + num + "] " + msg;
  this.logBody.appendChild(line);
  this.logBody.scrollTop = this.logBody.scrollHeight;
  // 控制日志行数，避免长时间运行内存膨胀
  while (this.logBody.childNodes.length > 800) {
    this.logBody.removeChild(this.logBody.firstChild);
  }
};

Visualizer.prototype.copyLog = function () {
  var self = this;
  var text = this.logBody.innerText || this.logBody.textContent || "";
  function done() {
    var old = self.btnCopy.textContent;
    self.btnCopy.textContent = "COPIED!";
    setTimeout(function () { self.btnCopy.textContent = old; }, 1200);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallback(); });
  } else {
    fallback();
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }
};

/* ---------- 统计 ---------- */
Visualizer.prototype.updateStats = function () {
  this.stCompare.textContent = this.compares;
  this.stSwap.textContent = this.swaps;
  this.stStep.textContent = this.stepCount;
  this.stTotal.textContent = this.total;
  if (this.finished) {
    this.stTime.textContent = this.elapsed.toFixed(3);
  } else if (this.startTime) {
    this.stTime.textContent = ((Date.now() - this.startTime) / 1000).toFixed(3);
  } else {
    this.stTime.textContent = "0.000";
  }
};

/* =======================================================================
   7. 庆祝弹窗
   ======================================================================= */
Visualizer.prototype.showCelebration = function () {
  var self = this;
  this.hideCelebration();

  this.celebrate.style.display = "flex";
  this.resizeFwCanvas();

  // 标题逐字
  var title = "大吉大利，恭喜吃鸡！";
  this.celTitle.innerHTML = Array.from(title).map(function (c) {
    return "<span>" + c + "</span>";
  }).join("");
  var tSpans = Array.prototype.slice.call(this.celTitle.children);
  requestAnimationFrame(function () {
    tSpans.forEach(function (s, i) {
      self.celTimers.push(setTimeout(function () { s.classList.add("in"); }, i * 180));
    });
  });

  // 统计行
  var statsData = [
    "compares: " + this.compares,
    "swaps: " + this.swaps,
    "total: " + this.total
  ];
  this.celStats.innerHTML = "";
  var lines = statsData.map(function (t) {
    var d = document.createElement("div");
    d.className = "cel-line";
    d.innerHTML = Array.from(t).map(function (c) {
      return "<span>" + (c === " " ? "&nbsp;" : c) + "</span>";
    }).join("");
    self.celStats.appendChild(d);
    return d;
  });

  var titleEnd = title.length * 180 + 500;
  var cursor = titleEnd;
  lines.forEach(function (line) {
    var spans = Array.prototype.slice.call(line.children);
    spans.forEach(function (s, i) {
      self.celTimers.push(setTimeout(function () { s.classList.add("in"); }, cursor + i * 50));
    });
    cursor += spans.length * 50 + 320;
  });

  // 耗时行
  var timeText = "总耗时: " + this.elapsed.toFixed(3) + " s";
  this.celTime.innerHTML = Array.from(timeText).map(function (c) {
    return "<span>" + (c === " " ? "&nbsp;" : c) + "</span>";
  }).join("");
  var ttSpans = Array.prototype.slice.call(this.celTime.children);
  ttSpans.forEach(function (s, i) {
    self.celTimers.push(setTimeout(function () { s.classList.add("in"); }, cursor + i * 90));
  });
  cursor += ttSpans.length * 90 + 350;

  // 关闭提示
  this.celTimers.push(setTimeout(function () { self.celHint.classList.add("in"); }, cursor));

  // 烟花
  this.startFireworks();

  // 12 秒自动关闭
  this.celCloseTimer = setTimeout(function () { self.hideCelebration(); }, 12000);
};

Visualizer.prototype.resizeFwCanvas = function () {
  var dpr = window.devicePixelRatio || 1;
  this.fwCanvas.width = Math.floor(window.innerWidth * dpr);
  this.fwCanvas.height = Math.floor(window.innerHeight * dpr);
  var ctx = this.fwCanvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
};

Visualizer.prototype.startFireworks = function () {
  var self = this;
  var ctx = this.fwCanvas.getContext("2d");
  var w = window.innerWidth, h = window.innerHeight;
  this.fw = new Fireworks(w, h);
  this.fw.burst(w / 2, h * 0.42);
  var last = performance.now();

  function loop(ts) {
    var dt = Math.min(3, (ts - last) / 16.667);
    last = ts;
    // 每帧先按当前遮罩清理为透明（拖尾）
    self.fw.w = w; self.fw.h = h;
    self.fw.step(dt);
    self.fw.draw(ctx, true);
    self.fwRaf = requestAnimationFrame(loop);
  }
  this.fwRaf = requestAnimationFrame(loop);
};

Visualizer.prototype.hideCelebration = function () {
  this.celebrate.style.display = "none";
  if (this.fwRaf) { cancelAnimationFrame(this.fwRaf); this.fwRaf = null; }
  this.fw = null;
  if (this.celCloseTimer) { clearTimeout(this.celCloseTimer); this.celCloseTimer = null; }
  this.celTimers.forEach(function (t) { clearTimeout(t); });
  this.celTimers = [];
  var ctx = this.fwCanvas.getContext("2d");
  ctx.clearRect(0, 0, this.fwCanvas.width, this.fwCanvas.height);
  this.celTitle.innerHTML = "";
  this.celStats.innerHTML = "";
  this.celTime.innerHTML = "";
  this.celHint.classList.remove("in");
};

/* =======================================================================
   8. GIF 导出（离屏渲染，不影响页面状态）
   ======================================================================= */
var GIF_JS_URL = "https://cdn.bootcdn.net/ajax/libs/gif.js/0.2.0/gif.js";
var GIF_WORKER_URL = "https://cdn.bootcdn.net/ajax/libs/gif.js/0.2.0/gif.worker.js";

function loadScriptOnce(url) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    s.src = url;
    s.onload = function () { resolve(); };
    s.onerror = function () { reject(new Error("脚本加载失败: " + url)); };
    document.head.appendChild(s);
  });
}

function fetchText(url) {
  return fetch(url).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  });
}

function withTimeout(promise, ms, msg) {
  return Promise.race([
    promise,
    new Promise(function (_, reject) {
      setTimeout(function () { reject(new Error(msg)); }, ms);
    })
  ]);
}

Visualizer.prototype.ensureGifLib = function () {
  if (window.GIF && window.__gifWorkerUrl) return Promise.resolve();
  var tasks = [];
  if (!window.GIF) tasks.push(loadScriptOnce(GIF_JS_URL));
  if (!window.__gifWorkerUrl) {
    tasks.push(fetchText(GIF_WORKER_URL).then(function (txt) {
      var blob = new Blob([txt], { type: "application/javascript" });
      window.__gifWorkerUrl = URL.createObjectURL(blob);
    }));
  }
  return Promise.all(tasks).then(function () {
    if (!window.GIF) throw new Error("GIF 库未就绪");
  });
};

Visualizer.prototype.exportGIF = function () {
  var self = this;
  if (this._exporting) return;
  this._exporting = true;
  var btn = this.btnGif;
  var oldText = btn.textContent;
  btn.textContent = "PREPARING...";
  btn.disabled = true;

  withTimeout(this.ensureGifLib(), 60000, "GIF 依赖加载超时（60s）")
    .then(function () { return self._renderGif(btn); })
    .then(function () { btn.textContent = oldText; btn.disabled = false; self._exporting = false; })
    .catch(function (err) {
      console.error(err);
      btn.textContent = "FAILED (see console)";
      setTimeout(function () { btn.textContent = oldText; }, 2200);
      btn.disabled = false;
      self._exporting = false;
    });
};

Visualizer.prototype._renderGif = function (btn) {
  var self = this;
  return new Promise(function (resolve, reject) {
    try {
      var colors = readThemeColors();
      var algo = AlgorithmRegistry.get(self.selectedAlgo);
      var cnLabel = algo.cnLabel;
      var enLabel = algo.label;

      // 先算出步骤序列，供尺寸估算与后续模拟共用
      var simSteps = algo.run(self.originalData.slice());

      // ---- 画布尺寸：同展示区，超限等比缩小 ----
      var rect = self.vizEl.getBoundingClientRect();
      var W = Math.max(240, Math.round(rect.width));
      var H = Math.max(180, Math.round(rect.height));
      var MAXW = 900, MAXH = 600;
      if (W > MAXW) { H = Math.round(H * MAXW / W); W = MAXW; }
      if (H > MAXH) { W = Math.round(W * MAXH / H); H = MAXH; }

      // ---- 内存预算：gif.js 用 copy:true 时会缓存每帧位图，
      //      帧数 = 80(intro) + 60(outro) + 排序帧，按 4B/像素 反推安全分辨率 ----
      var estSortFrames = Math.min(300, simSteps.length);
      var estFrames = 141 + estSortFrames;
      var BUDGET_BYTES = 300 * 1024 * 1024;      // 约 300MB 上限
      var maxPixels = BUDGET_BYTES / 4 / estFrames;
      if (W * H > maxPixels) {
        var k = Math.sqrt(maxPixels / (W * H));
        W = Math.max(320, Math.round(W * k));
        H = Math.max(240, Math.round(H * k));
      }
      W = W % 2 === 0 ? W : W + 1;
      H = H % 2 === 0 ? H : H + 1;

      var canvas = document.createElement("canvas");
      canvas.width = W;
      canvas.height = H;
      var ctx = canvas.getContext("2d");

      // ---- 布局常量（三层嵌套间距） ----
      var imgMargin = 12;   // 边框距图片边缘
      var barMargin = 10;   // 柱子距边框
      var frameRect = { x: imgMargin, y: 54, w: W - imgMargin * 2, h: H - 54 - imgMargin };
      var barArea = {
        x: frameRect.x + barMargin,
        y: frameRect.y + barMargin,
        w: frameRect.w - barMargin * 2,
        h: frameRect.h - barMargin * 2
      };

      // ---- 局部独立变量，绝不触碰 this.* ----
      var simData = self.originalData.slice();
      var simSorted = {};
      var simHL = {};

      function simStep(step) {
        simHL = {};
        var i;
        if (step.type === StepType.SWAP || step.type === StepType.SET || step.type === StepType.DONE) {
          if (step.data) simData = step.data.slice();
        }
        if (step.type === StepType.MARK_SORTED) {
          for (i = 0; i < step.indices.length; i++) simSorted[step.indices[i]] = true;
        } else if (step.type === StepType.COMPARE) {
          for (i = 0; i < step.indices.length; i++) simHL[step.indices[i]] = "compare";
        } else if (step.type === StepType.SWAP) {
          for (i = 0; i < step.indices.length; i++) simHL[step.indices[i]] = "swap";
        } else if (step.type === StepType.PIVOT) {
          for (i = 0; i < step.indices.length; i++) simHL[step.indices[i]] = "pivot";
        }
      }

      function drawTitleStatic() {
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.fillStyle = colors.green;
        ctx.shadowColor = colors.green;
        ctx.shadowBlur = 8;
        ctx.font = "bold 16px 'Microsoft YaHei',Consolas,monospace";
        ctx.fillText(cnLabel, W / 2, 24);
        ctx.shadowBlur = 4;
        ctx.fillStyle = colors.amber;
        ctx.font = "11px Consolas,monospace";
        ctx.fillText(enLabel, W / 2, 42);
        ctx.restore();
      }

      function drawSceneBase(barAlpha, borderAlpha) {
        ctx.fillStyle = colors.bg;
        ctx.fillRect(0, 0, W, H);
        drawBarsOnCanvas(ctx, simData, simSorted, simHL, barArea, colors, barAlpha);
        drawCornerFrame(ctx, frameRect, colors.green, 0.7 * borderAlpha);
        drawTitleStatic();
      }

      function drawSortFrame() {
        drawSceneBase(1, 1);
      }

      // ---------- 建立编码器 ----------
      if (typeof window.GIF !== "function") { reject(new Error("GIF 构造函数不可用")); return; }
      var gif = new window.GIF({
        workers: 2,
        quality: 10,
        width: W,
        height: H,
        workerScript: window.__gifWorkerUrl
      });

      /* ===== 段 1：开头特效 4s = 80 帧 × 50ms ===== */
      for (var i = 0; i < 80; i++) {
        var t = i < 20 ? 0 : easeInOutCubic((i - 20) / 59);
        ctx.fillStyle = colors.bg;
        ctx.fillRect(0, 0, W, H);

        if (t > 0) {
          // 场景（柱 + 边框）渐显
          drawBarsOnCanvas(ctx, simData, simSorted, simHL, barArea, colors, t);
          drawCornerFrame(ctx, frameRect, colors.green, 0.7 * t);
        }
        // 黑色遮罩从完全不透明渐隐到透明
        if (t < 1) {
          ctx.save();
          ctx.globalAlpha = 1 - t;
          ctx.fillStyle = "#000000";
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }
        // 标题：中央大字号 → 边框上方小字号
        var cnSize = lerp(36, 16, t);
        var enSize = lerp(18, 11, t);
        var cyC = lerp(H * 0.5, 24, t);
        var cyE = lerp(H * 0.5 + enSize + 10, 42, t);
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.shadowColor = colors.green;
        ctx.shadowBlur = 18 * (1 - 0.55 * t);
        ctx.fillStyle = colors.green;
        ctx.font = "bold " + cnSize.toFixed(1) + "px 'Microsoft YaHei',Consolas,monospace";
        ctx.fillText(cnLabel, W / 2, cyC);
        ctx.shadowBlur = 8 * (1 - 0.55 * t);
        ctx.fillStyle = colors.amber;
        ctx.font = enSize.toFixed(1) + "px Consolas,monospace";
        ctx.fillText(enLabel, W / 2, cyE);
        ctx.restore();

        gif.addFrame(canvas, { delay: 50, copy: true });
      }

      /* ===== 段 2：排序帧 ===== */
      var baseDelay = Math.max(20, 810 - self.speed * 8);
      var totalSteps = simSteps.length;
      var perFrame = Math.max(1, Math.ceil(totalSteps / 300)); // 控制在 300 帧内，避免内存爆掉
      var sortDelay = Math.min(500, baseDelay * perFrame);

      // 初始帧
      drawSortFrame();
      gif.addFrame(canvas, { delay: sortDelay, copy: true });

      var idx = 0;
      while (idx < totalSteps) {
        for (var k = 0; k < perFrame && idx < totalSteps; k++) {
          simStep(simSteps[idx]);
          idx++;
        }
        drawSortFrame();
        gif.addFrame(canvas, { delay: sortDelay, copy: true });
      }

      /* ===== 段 3：结尾特效 3s = 60 帧 × 50ms ===== */
      var fw = new Fireworks(W, H);
      fw.burst(W / 2, H * 0.42);
      var finalData = simData.slice();
      var finalSorted = {};
      for (var fi = 0; fi < finalData.length; fi++) finalSorted[fi] = true;

      var statsLines = [
        "compares: " + algo.compareCount,
        "swaps: " + algo.swapCount,
        "total: " + (algo.compareCount + algo.swapCount)
      ];
      var timeLine = "总耗时: " + (sortDelay * (totalSteps / perFrame) / 1000).toFixed(3) + " s";

      for (var f = 0; f < 60; f++) {
        var ft = f / 59;
        // 背景：最终排序状态 + 半透明黑色遮罩（模拟虚化）
        ctx.fillStyle = colors.bg;
        ctx.fillRect(0, 0, W, H);
        drawBarsOnCanvas(ctx, finalData, finalSorted, {}, barArea, colors, 1);
        drawCornerFrame(ctx, frameRect, colors.green, 0.7);
        drawTitleStatic();
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(0, 0, W, H);

        // 烟花
        fw.w = W; fw.h = H;
        fw.step(2);
        fw.draw(ctx, false);

        // 文字动画
        var titleP = Math.min(1, ft / 0.3);
        drawAnimatedText(ctx, "大吉大利，恭喜吃鸡！", W / 2, H * 0.42, 32, "#ffd700", titleP, true);

        var s0 = 0.35, s1 = 0.6;
        if (ft >= s0) {
          var sp = Math.min(1, (ft - s0) / (s1 - s0));
          for (var li = 0; li < statsLines.length; li++) {
            var lineStart = li / statsLines.length;
            var lineEnd = (li + 1) / statsLines.length;
            var lp = (sp - lineStart) / (lineEnd - lineStart);
            if (lp < 0) lp = 0;
            if (lp > 1) lp = 1;
            if (lp > 0) {
              drawAnimatedText(ctx, statsLines[li], W / 2, H * 0.57 + li * 22, 18, colors.green, lp, false);
            }
          }
        }
        var t0 = 0.65, t1 = 0.85;
        if (ft >= t0) {
          var tp = Math.min(1, (ft - t0) / (t1 - t0));
          drawAnimatedText(ctx, timeLine, W / 2, H * 0.79, 22, colors.green, tp, true);
        }

        gif.addFrame(canvas, { delay: 50, copy: true });
      }

      // ---------- 编码 ----------
      gif.on("progress", function (p) {
        btn.textContent = "ENCODING " + Math.round(p * 100) + "%";
      });
      gif.on("finished", function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        var ts = new Date();
        function p2(n) { return n < 10 ? "0" + n : "" + n; }
        var stamp = ts.getFullYear() + p2(ts.getMonth() + 1) + p2(ts.getDate()) +
          "-" + p2(ts.getHours()) + p2(ts.getMinutes()) + p2(ts.getSeconds());
        a.href = url;
        a.download = "sort-" + self.selectedAlgo + "-n" + self.count + "-" + stamp + ".gif";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        resolve();
      });

      gif.render();

    } catch (e) {
      reject(e);
    }
  });
};

/* =======================================================================
   9. 启动
   ======================================================================= */
function boot() {
  V = new Visualizer();
  V.init();
}
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
